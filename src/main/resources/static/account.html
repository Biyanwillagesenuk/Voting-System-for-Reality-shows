<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile & Account - Voting System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { overflow-x: hidden; transition: background-color 0.4s ease, color 0.4s ease; }
        ::selection { background: currentColor; color: background; }

        .profile-input { width: 100%; background: transparent; border-bottom: 1px solid; border-color: inherit; padding: 0.75rem 0; font-size: 1rem; transition: all 0.3s ease; outline: none; border-radius: 0; opacity: 0.8; }
        .profile-input:focus { opacity: 1; border-color: currentColor; }
        .profile-input::placeholder { opacity: 0.4; }

        body.theme-light { background-color: #f2f2f2; color: #000000; }
        body.theme-light .profile-card { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-color: #e4e4e7; }
        body.theme-light .profile-header { background-color: rgba(242, 242, 242, 0.9); border-color: #e4e4e7; }

        body.theme-dark { background-color: #050609; color: #f2f2f2; }
        body.theme-dark .profile-card { background-color: rgba(18, 19, 22, 0.9); backdrop-filter: blur(12px); border-color: #27272a; }
        body.theme-dark .profile-header { background-color: rgba(5, 6, 9, 0.9); border-color: #27272a; }

        body.theme-white { background-color: #ffffff; color: #09090b; }
        body.theme-white .profile-card { background-color: rgba(249, 249, 251, 0.9); backdrop-filter: blur(12px); border-color: #f4f4f5; }
        body.theme-white .profile-header { background-color: rgba(255, 255, 255, 0.9); border-color: #f4f4f5; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col theme-light relative" id="site-body">

<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-10">
    <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=1600&q=80" alt="Background" class="w-full h-full object-cover grayscale mix-blend-multiply">
</div>

<!-- TOP HEADER -->
<div class="profile-header sticky top-0 backdrop-blur-md z-50 border-b px-8 py-6 flex justify-between items-center transition-colors duration-300">
    <a href="index.html" class="flex items-center gap-2 text-sm font-bold uppercase tracking-widest opacity-80 hover:opacity-100 transition-opacity">
        <i data-lucide="arrow-left" class="w-5 h-5"></i> Return Home
    </a>
    <div class="flex items-center border rounded-full p-1 text-xs font-bold uppercase tracking-wider border-current/25">
        <button onclick="setTheme('theme-light')" id="btn-light" class="px-3 py-1 rounded-full transition-all">Light</button>
        <button onclick="setTheme('theme-dark')" id="btn-dark" class="px-3 py-1 rounded-full transition-all">Dark</button>
    </div>
    <button onclick="handleLogout()" class="flex items-center gap-1 text-sm font-bold uppercase tracking-widest text-red-500 hover:opacity-100 transition-opacity cursor-pointer">
        <i data-lucide="log-out" class="w-4 h-4"></i> Logout
    </button>
</div>

<!-- MAIN CONTAINER -->
<main class="max-w-5xl mx-auto px-6 py-16 flex-1 w-full relative z-10">

    <!-- ALERT BOX -->
    <div id="alert-box" class="hidden text-sm font-mono uppercase tracking-wider mb-8 p-4 border rounded shadow-md"></div>

    <!-- PROFILE HERO BANNER -->
    <div class="profile-card p-8 border rounded-2xl shadow-2xl mb-10 flex flex-col md:flex-row items-center gap-8 transition-colors duration-300">
        <div class="relative">
            <div id="avatar-container" class="w-28 h-28 rounded-full bg-current/10 border-2 border-current/30 flex items-center justify-center text-3xl font-bold uppercase overflow-hidden shadow-inner">
                <span id="avatar-initials">--</span>
            </div>
            <div class="absolute bottom-0 right-0 bg-blue-600 text-white p-2 rounded-full shadow-lg border border-current/20">
                <i data-lucide="shield-check" class="w-4 h-4"></i>
            </div>
        </div>
        <div class="text-center md:text-left flex-1">
            <span id="profile-role-badge" class="inline-block px-3 py-1 mb-2 text-[10px] font-mono font-bold uppercase tracking-widest border border-current/30 rounded-full bg-current/5">Member</span>
            <h1 id="profile-display-name" class="text-3xl font-bold uppercase tracking-tight">Loading Profile...</h1>
            <p id="profile-display-email" class="text-sm font-mono opacity-60 mt-1">connecting@database...</p>
        </div>
        <div class="flex flex-col gap-2 w-full md:w-auto">
            <div class="text-xs font-mono opacity-60 text-center md:text-right uppercase tracking-widest">Account Status</div>
            <div class="flex items-center justify-center md:justify-end gap-2 text-xs font-bold uppercase font-mono bg-green-500/10 text-green-500 border border-green-500/20 px-4 py-2 rounded-lg">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Active Node
            </div>
        </div>
    </div>

    <!-- SETTINGS GRID -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

        <!-- EDIT PROFILE DETAILS -->
        <div class="profile-card p-8 border rounded-2xl shadow-2xl transition-colors duration-300">
            <div class="flex items-center gap-3 mb-6 pb-4 border-b border-current/10">
                <i data-lucide="user-cog" class="w-5 h-5"></i>
                <h3 class="font-bold text-lg uppercase tracking-widest">Edit Personal Data</h3>
            </div>
            <form onsubmit="updateProfile(event)" class="flex flex-col gap-6">
                <div>
                    <label class="block text-xs font-mono uppercase opacity-60 mb-1">Full Name</label>
                    <input type="text" id="acc-name" class="profile-input text-base font-medium" required>
                </div>
                <div>
                    <label class="block text-xs font-mono uppercase opacity-60 mb-1">Email Address (Locked)</label>
                    <input type="email" id="acc-email" class="profile-input text-base opacity-50 cursor-not-allowed font-mono" disabled>
                </div>
                <div>
                    <label class="block text-xs font-mono uppercase opacity-60 mb-1">Phone Number</label>
                    <input type="text" id="acc-phone" class="profile-input text-base font-mono" pattern="\d{10}" required>
                </div>
                <div>
                    <label class="block text-xs font-mono uppercase opacity-60 mb-1">Assigned Role</label>
                    <input type="text" id="acc-role" class="profile-input text-base opacity-50 cursor-not-allowed font-mono uppercase" disabled>
                </div>
                <button type="submit" class="w-full bg-current text-background text-xs font-bold uppercase tracking-widest py-4 hover:opacity-90 transition-opacity mt-4 shadow-lg cursor-pointer" style="background-color: var(--tw-prose-invert-body, black); color: white;">Save Changes</button>
            </form>
        </div>

        <!-- SECURITY & PASSWORD CHANGE -->
        <div class="profile-card p-8 border rounded-2xl shadow-2xl transition-colors duration-300">
            <div class="flex items-center gap-3 mb-6 pb-4 border-b border-current/10">
                <i data-lucide="lock" class="w-5 h-5"></i>
                <h3 class="font-bold text-lg uppercase tracking-widest">Security Credentials</h3>
            </div>
            <form onsubmit="changePassword(event)" class="flex flex-col gap-6">
                <div class="p-4 bg-orange-500/10 border border-orange-500/20 text-orange-600 text-xs font-mono rounded">
                    Tip: Use a strong password with a mix of letters, numbers, and symbols to protect your voting privileges.
                </div>
                <div>
                    <label class="block text-xs font-mono uppercase opacity-60 mb-1">New Password</label>
                    <input type="password" id="new-pass" class="profile-input text-base" required minlength="6">
                </div>
                <div>
                    <label class="block text-xs font-mono uppercase opacity-60 mb-1">Confirm New Password</label>
                    <input type="password" id="confirm-pass" class="profile-input text-base" required minlength="6">
                </div>
                <button type="submit" class="w-full bg-current text-background text-xs font-bold uppercase tracking-widest py-4 hover:opacity-90 transition-opacity mt-10 shadow-lg cursor-pointer" style="background-color: var(--tw-prose-invert-body, black); color: white;">Update Password</button>
            </form>
        </div>

    </div>
</main>

<footer class="py-10 text-center text-xs font-mono opacity-40 uppercase tracking-widest relative z-10">
    &copy; 2026 Reality Show Voting System &bull; Secure Account Hub
</footer>

<script>
    const API_BASE = 'http://localhost:8080/api/users';

    function setTheme(themeName) {
        const body = document.getElementById('site-body');
        body.className = `antialiased min-h-screen flex flex-col relative ${themeName}`;
        localStorage.setItem('preferred-theme', themeName);

        ['theme-light', 'theme-dark', 'theme-white'].forEach(t => {
            const btn = document.getElementById(t.replace('theme-', 'btn-'));
            if(btn) {
                if(t === themeName) {
                    btn.style.backgroundColor = 'currentColor';
                    btn.style.color = themeName === 'theme-dark' ? '#000' : '#fff';
                } else {
                    btn.style.backgroundColor = 'transparent';
                    btn.style.color = 'inherit';
                }
            }
        });
    }

    function handleLogout() {
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = 'user-portal.html';
    }

    function showAlert(message, isSuccess) {
        const box = document.getElementById('alert-box');
        box.textContent = message;
        box.className = `text-sm font-mono uppercase tracking-wider mb-8 p-4 border rounded shadow-md ${isSuccess ? 'bg-green-500/10 text-green-500 border-green-500/20' : 'bg-red-500/10 text-red-500 border-red-500/20'}`;
        box.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function loadAccountData() {
        const userId = localStorage.getItem('userId') || sessionStorage.getItem('userId');
        console.log("Resolved userId from storage:", userId);

        if (!userId || userId === "undefined" || userId === "null") {
            console.warn("Valid userId missing in browser storage.");
            showAlert("Session missing or expired. Please log in again.", false);
            setTimeout(() => { window.location.href = 'user-portal.html'; }, 2000);
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/${userId}`);

            if (res.status === 404) {
                console.warn("User ID not found in database. Server was likely restarted.");
                showAlert("Server data was reset. Please log in again.", false);
                localStorage.clear();
                sessionStorage.clear();
                setTimeout(() => { window.location.href = 'user-portal.html'; }, 2500);
                return;
            }

            if (res.ok) {
                const user = await res.json();
                console.log("User data loaded successfully:", user);

                document.getElementById('acc-name').value = user.name || '';
                document.getElementById('acc-email').value = user.email || '';
                document.getElementById('acc-phone').value = user.phoneNum || '';
                document.getElementById('acc-role').value = user.role || '';

                document.getElementById('profile-display-name').textContent = user.name || 'User Profile';
                document.getElementById('profile-display-email').textContent = user.email || '';
                document.getElementById('profile-role-badge').textContent = user.role || 'Member';

                const nameParts = (user.name || 'U').trim().split(' ');
                const initials = nameParts.length > 1 ? `${nameParts[0][0]}${nameParts[1][0]}` : nameParts[0].substring(0, 2);
                document.getElementById('avatar-initials').textContent = initials.toUpperCase();
            } else {
                showAlert("Could not retrieve profile data from server.", false);
            }
        } catch (error) {
            console.error("Connection error:", error);
            showAlert("Server connection failed. Make sure Spring Boot is running.", false);
        }
    }

    async function updateProfile(e) {
        e.preventDefault();
        const userId = localStorage.getItem('userId') || sessionStorage.getItem('userId');
        const payload = {
            name: document.getElementById('acc-name').value,
            phoneNum: document.getElementById('acc-phone').value
        };

        try {
            const res = await fetch(`${API_BASE}/${userId}/update-profile`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                showAlert('Profile data updated successfully!', true);
                localStorage.setItem('userName', payload.name);
                sessionStorage.setItem('userName', payload.name);
                document.getElementById('profile-display-name').textContent = payload.name;
            } else {
                showAlert('Failed to update profile data.', false);
            }
        } catch (error) {
            showAlert('Server connection error.', false);
        }
    }

    async function changePassword(e) {
        e.preventDefault();
        const newPass = document.getElementById('new-pass').value;
        const confirmPass = document.getElementById('confirm-pass').value;
        const email = document.getElementById('acc-email').value;

        if (newPass !== confirmPass) {
            showAlert('New passwords do not match!', false);
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/update-password`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, newPassword: newPass })
            });
            if (res.ok) {
                showAlert('Security password changed successfully!', true);
                document.getElementById('new-pass').value = '';
                document.getElementById('confirm-pass').value = '';
            } else {
                showAlert('Failed to update password.', false);
            }
        } catch (error) {
            showAlert('Server connection error during password update.', false);
        }
    }
    const Auth = {
        get(key) {
            const v = sessionStorage.getItem(key) ?? localStorage.getItem(key);
            return (v === 'undefined' || v === 'null') ? null : v;
        },
        save(user, role) {
            const { passwordHash, password, ...safeUser } = user;
            const entries = {
                isLoggedIn: 'true',
                userId: String(user.id),
                userName: user.name || user.email || 'User',
                userEmail: user.email || '',
                userRole: role,
                userProfile: JSON.stringify(safeUser)
            };
            Object.entries(entries).forEach(([k, v]) => {
                sessionStorage.setItem(k, v);
                localStorage.setItem(k, v);
            });
        },
        clear() {
            ['isLoggedIn', 'userId', 'userName', 'userEmail', 'userRole', 'userProfile', 'isAdminAuthenticated']
                .forEach(k => { sessionStorage.removeItem(k); localStorage.removeItem(k); });
        },
        get isLoggedIn() { return this.get('isLoggedIn') === 'true' && !!this.get('userId'); },
        get userId()     { return this.get('userId'); },
        get userName()   { return this.get('userName') || 'User'; },
        get userEmail()  { return this.get('userEmail') || ''; },
        get role()       { return (this.get('userRole') || '').toUpperCase().replace('ROLE_', ''); },
        get profile()    { try { return JSON.parse(this.get('userProfile')); } catch { return null; } },

        // --> REPLACE YOUR LOGOUT METHOD WITH THIS ENTIRE BLOCK:
        logout(redirect = 'user-portal.html') {
            this.clear();
            localStorage.clear();
            sessionStorage.clear();
            window.location.replace(redirect);
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('preferred-theme') || 'theme-light';
        setTheme(savedTheme);
        loadAccountData();
        lucide.createIcons();
    });
</script>
</body>
</html>
