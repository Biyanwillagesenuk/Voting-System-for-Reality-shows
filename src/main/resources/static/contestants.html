<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contestants Registry - Voting System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['"Playfair Display"', 'serif'] }, colors: { theme: { bg: '#f2f2f2', dark: '#000000', accent: '#09090b', footerText: '#F5F4E8' } } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { overflow-x: hidden; transition: background-color 0.4s ease, color 0.4s ease; }
        ::selection { background: currentColor; color: background; }
        .mask-fade-bottom { -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%); mask-image: linear-gradient(to bottom, black 40%, transparent 100%); }

        /* Theme Styles */
        body.theme-light { background-color: #f2f2f2; color: #000000; }
        body.theme-light nav { background-color: rgba(242, 242, 242, 0.9); border-color: #e4e4e7; }

        body.theme-dark { background-color: #050609; color: #f2f2f2; }
        body.theme-dark nav { background-color: rgba(5, 6, 9, 0.9); border-color: #27272a; }

        body.theme-white { background-color: #ffffff; color: #09090b; }
        body.theme-white nav { background-color: rgba(255, 255, 255, 0.9); border-color: #f4f4f5; }
    </style>
</head>
<body class="antialiased theme-light" id="site-body">

<nav class="fixed w-full z-50 backdrop-blur-md h-24 flex items-center justify-between px-8 border-b transition-colors duration-300">
    <div class="flex items-center gap-4">
        <img src="https://i.ibb.co/zTyKTFdf/LOGO-CODE-COMPANY-NEGRO.png" alt="Logo" class="h-8 dark:invert">
        <span class="font-semibold text-sm tracking-widest uppercase">VoteSystem</span>
    </div>

    <div class="hidden md:flex items-center gap-10 text-sm font-medium tracking-wide">
        <a href="index.html" class="relative hover:opacity-75 transition-opacity">Discover</a>
        <a href="#" class="relative border-b-2 border-current pb-1">Contestants</a>
        <a href="index.html" class="relative hover:opacity-75 transition-opacity">Live Voting</a>
    </div>

    <div class="flex items-center gap-6">
        <!-- THEME SWITCHER -->
        <div class="flex items-center border rounded-full p-1 text-xs font-bold uppercase tracking-wider border-current/20">
            <button onclick="setTheme('theme-light')" id="btn-light" class="px-3 py-1 rounded-full transition-all">Light</button>
            <button onclick="setTheme('theme-dark')" id="btn-dark" class="px-3 py-1 rounded-full transition-all">Dark</button>
        </div>

        <a href="login.html" class="text-sm font-medium hover:opacity-75 flex items-center gap-2 transition-opacity">
            <i data-lucide="log-in" class="w-4 h-4"></i> Admin Login
        </a>
        <button class="bg-current text-background px-6 py-2.5 text-sm font-medium rounded-full hover:opacity-90 transition-opacity" style="background-color: var(--tw-prose-invert-body, black); color: white;">Cast Vote</button>
    </div>
</nav>

<section class="relative pt-40 pb-12 px-8 flex flex-col items-center text-center border-b border-current/20">
    <div class="absolute inset-0 z-0 pointer-events-none opacity-20 mask-fade-bottom">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=1600&q=80" alt="Studio" class="w-full h-full object-cover grayscale mix-blend-multiply">
    </div>
    <div class="relative z-10">
        <div class="inline-flex items-center gap-3 mb-6">
            <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
            <span class="text-xs font-bold uppercase tracking-widest opacity-60">Live Roster</span>
        </div>
        <h1 class="text-5xl md:text-7xl font-bold tracking-tighter uppercase mb-6">Contestants Registry</h1>
        <p class="max-w-xl mx-auto text-sm md:text-base font-medium opacity-80">Review active specimens added from the management console. Cast your vote securely.</p>
    </div>
</section>

<section class="max-w-[1400px] mx-auto px-8 py-24">
    <div class="flex justify-between items-end border-b border-current/20 pb-4 mb-12">
        <div class="text-xs font-bold uppercase tracking-widest flex gap-8">
            <span class="border-b border-current pb-1 cursor-pointer">All Roster Database</span>
        </div>
        <div class="font-mono text-xs opacity-60" id="roster-count">FETCHING REGISTRY...</div>
    </div>

    <!-- Dynamic Grid container -->
    <div id="contestants-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- Dynamically populated from backend database -->
    </div>
</section>

<footer class="bg-black text-zinc-500 py-12 text-center text-xs uppercase tracking-widest">
    <p>&copy; 2026 Moshain D:) Designed for absolute voting.</p>
</footer>

<script>
    lucide.createIcons();
    const API_BASE_URL = 'http://localhost:8080/api';

    // Theme Switcher Logic
    function setTheme(themeName) {
        const body = document.getElementById('site-body');
        body.className = `antialiased ${themeName}`;
        localStorage.setItem('preferred-theme', themeName);

        ['theme-light', 'theme-dark', 'theme-white'].forEach(t => {
            const btn = document.getElementById(t.replace('theme-', 'btn-'));
            if(btn) {
                if(t === themeName) {
                    btn.style.backgroundColor = 'currentColor';
                    btn.style.color = themeName === 'theme-dark' ? '#000' : '#fff';
                } else {
                    btn.style.backgroundColor = 'transparent';
                    btn.style.color = 'inherit';
                }
            }
        });
    }

    async function loadPublicContestants() {
        const grid = document.getElementById('contestants-grid');
        const countLabel = document.getElementById('roster-count');

        try {
            const response = await fetch(`${API_BASE_URL}/contestants`);
            const contestants = await response.json();

            grid.innerHTML = '';
            countLabel.innerText = `DISPLAYING: 0${contestants.length} SPECIMENS`;

            if (contestants.length === 0) {
                grid.innerHTML = '<p class="text-xs font-mono opacity-60 uppercase col-span-3 py-12 text-center">No active contestants found in the database.</p>';
                return;
            }

            contestants.forEach((cont) => {
                const photo = cont.photoUrl ? cont.photoUrl : 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600&q=80';
                const refNum = String(cont.id).padStart(3, '0');

                grid.innerHTML += `
                        <div class="group cursor-pointer">
                            <div class="relative overflow-hidden bg-black aspect-[3/4] mb-4">
                                <img src="${photo}" alt="${cont.name}" class="w-full h-full object-cover opacity-60 grayscale group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-700 group-hover:scale-105">
                                <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-500 bg-black/20">
                                    <button class="bg-white text-black px-8 py-3 text-sm font-bold uppercase tracking-widest rounded-full hover:scale-105 transition-transform shadow-2xl">Cast Vote</button>
                                </div>
                                <div class="absolute top-4 right-4 bg-white text-black text-[10px] font-mono px-3 py-1 font-bold">REF-${refNum}</div>
                            </div>
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="text-2xl font-bold tracking-tight uppercase group-hover:opacity-60 transition-colors">${cont.name}</h3>
                                    <p class="text-xs font-mono opacity-60 mt-1 uppercase">Bio: ${cont.bio} (Age: ${cont.age})</p>
                                </div>
                                <i data-lucide="arrow-up-right" class="w-6 h-6 opacity-40 group-hover:opacity-100 transition-colors transform group-hover:translate-x-1 group-hover:-translate-y-1"></i>
                            </div>
                        </div>
                    `;
            });
            lucide.createIcons();
        } catch (error) {
            console.error("Backend offline:", error);
            grid.innerHTML = '<p class="text-xs font-mono text-red-500 uppercase col-span-3 text-center py-12">Database connection failed.</p>';
            countLabel.innerText = 'STATUS: OFFLINE';
        }
    }

    window.onload = () => {
        const savedTheme = localStorage.getItem('preferred-theme') || 'theme-light';
        setTheme(savedTheme);
        loadPublicContestants();
    };
</script>
</body>
</html>
