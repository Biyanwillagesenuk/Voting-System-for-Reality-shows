<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Authentication - Voting System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { overflow-x: hidden; transition: background-color 0.4s ease, color 0.4s ease; }
        ::selection { background: currentColor; color: background; }

        .admin-input { width: 100%; background: transparent; border-bottom: 1px solid; border-color: inherit; padding: 0.75rem 0; font-size: 0.875rem; transition: all 0.3s ease; outline: none; border-radius: 0; opacity: 0.8; }
        .admin-input:focus { opacity: 1; border-color: currentColor; }
        .admin-input::placeholder { opacity: 0.4; }

        /* Theme Styles with Glassmorphism */
        body.theme-light { background-color: #f2f2f2; color: #000000; }
        body.theme-light .admin-card { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-color: #e4e4e7; }

        body.theme-dark { background-color: #050609; color: #f2f2f2; }
        body.theme-dark .admin-card { background-color: rgba(18, 19, 22, 0.9); backdrop-filter: blur(12px); border-color: #27272a; }

        body.theme-white { background-color: #ffffff; color: #09090b; }
        body.theme-white .admin-card { background-color: rgba(249, 249, 251, 0.9); backdrop-filter: blur(12px); border-color: #f4f4f5; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center theme-light relative" id="site-body">

<!-- AMBIENT BACKGROUND OVERLAY -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-10">
    <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=1600&q=80" alt="Background" class="w-full h-full object-cover grayscale mix-blend-multiply">
</div>

<!-- TOP CONTROLS BAR -->
<div class="absolute top-8 left-8 right-8 flex justify-between items-center z-10">
    <a href="index.html" class="flex items-center gap-2 text-xs font-bold uppercase tracking-widest opacity-70 hover:opacity-100 transition-opacity">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Return Home
    </a>
    <div class="flex items-center border rounded-full p-1 text-xs font-bold uppercase tracking-wider border-current/25">
        <button onclick="setTheme('theme-light')" id="btn-light" class="px-3 py-1 rounded-full transition-all">Light</button>
        <button onclick="setTheme('theme-dark')" id="btn-dark" class="px-3 py-1 rounded-full transition-all">Dark</button>
    </div>
</div>

<!-- LOGIN CONTAINER -->
<div class="relative z-10 max-w-md w-full px-6">
    <div class="admin-card p-10 border shadow-2xl transition-colors duration-300">
        <div class="flex items-center gap-3 mb-8">
            <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
            <h2 class="font-bold text-sm tracking-widest uppercase">Admin Gateway</h2>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="flex flex-col gap-6">
            <div>
                <label class="block text-[10px] font-mono uppercase opacity-60 mb-1">Username</label>
                <input type="text" id="admin-user" class="admin-input" placeholder="Enter admin username" required>
            </div>
            <div>
                <label class="block text-[10px] font-mono uppercase opacity-60 mb-1">Password</label>
                <input type="password" id="admin-pass" class="admin-input" placeholder="••••••••••••" required>
            </div>
            <div id="error-msg" class="text-xs text-red-500 font-mono hidden uppercase tracking-wider">Invalid credentials. Access denied.</div>
            <button type="submit" class="w-full bg-current text-background text-xs font-bold uppercase tracking-widest py-4 hover:opacity-90 transition-opacity mt-2" style="background-color: var(--tw-prose-invert-body, black); color: white;">
                Authenticate Session
            </button>
        </form>
    </div>
</div>

<script>
    lucide.createIcons();

    // Static Credentials Configured Here
    const STATIC_USER = "admin";
    const STATIC_PASS = "admin123";

    function setTheme(themeName) {
        const body = document.getElementById('site-body');
        body.className = `antialiased min-h-screen flex flex-col items-center justify-center relative ${themeName}`;
        localStorage.setItem('preferred-theme', themeName);

        ['theme-light', 'theme-dark', 'theme-white'].forEach(t => {
            const btn = document.getElementById(t.replace('theme-', 'btn-'));
            if(btn) {
                if(t === themeName) {
                    btn.style.backgroundColor = 'currentColor';
                    btn.style.color = themeName === 'theme-dark' ? '#000' : '#fff';
                } else {
                    btn.style.backgroundColor = 'transparent';
                    btn.style.color = 'inherit';
                }
            }
        });
    }

    function handleLogin(event) {
        event.preventDefault();
        const userInput = document.getElementById('admin-user').value;
        const passInput = document.getElementById('admin-pass').value;
        const errorBox = document.getElementById('error-msg');

        if (userInput === STATIC_USER && passInput === STATIC_PASS) {
            // Set secure session flag
            sessionStorage.setItem('isAdminAuthenticated', 'true');
            // Redirect to management panel
            window.location.href = 'management.html';
        } else {
            errorBox.classList.remove('hidden');
            document.getElementById('admin-pass').value = '';
        }
    }

    window.onload = () => {
        const savedTheme = localStorage.getItem('preferred-theme') || 'theme-light';
        setTheme(savedTheme);
        // If already logged in, skip login page
        if(sessionStorage.getItem('isAdminAuthenticated') === 'true') {
            window.location.href = 'management.html';
        }
    };
</script>
</body>
</html>
