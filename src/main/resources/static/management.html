<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management - Voting System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { overflow-x: hidden; transition: background-color 0.4s ease, color 0.4s ease; }
        ::selection { background: currentColor; color: background; }

        .admin-input { width: 100%; background: transparent; border-bottom: 1px solid; border-color: inherit; padding: 0.5rem 0; font-size: 0.875rem; transition: all 0.3s ease; outline: none; border-radius: 0; opacity: 0.8; }
        .admin-input:focus { opacity: 1; border-color: currentColor; }
        .admin-input::placeholder { opacity: 0.5; }

        /* Theme Styles with Glassmorphism */
        body.theme-light { background-color: #f2f2f2; color: #000000; }
        body.theme-light .admin-header { background-color: rgba(242, 242, 242, 0.85); border-color: #e4e4e7; }
        body.theme-light .admin-card { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-color: #e4e4e7; }

        body.theme-dark { background-color: #050609; color: #f2f2f2; }
        body.theme-dark .admin-header { background-color: rgba(5, 6, 9, 0.85); border-color: #27272a; }
        body.theme-dark .admin-card { background-color: rgba(18, 19, 22, 0.9); backdrop-filter: blur(12px); border-color: #27272a; }

        body.theme-white { background-color: #ffffff; color: #09090b; }
        body.theme-white .admin-header { background-color: rgba(255, 255, 255, 0.85); border-color: #f4f4f5; }
        body.theme-white .admin-card { background-color: rgba(249, 249, 251, 0.9); backdrop-filter: blur(12px); border-color: #f4f4f5; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col theme-light relative" id="site-body">

<!-- AMBIENT BACKGROUND OVERLAY -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-10">
    <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=1600&q=80" alt="Ambient Stage Background" class="w-full h-full object-cover grayscale mix-blend-multiply">
</div>

<div class="admin-header sticky top-0 backdrop-blur-md z-50 border-b px-8 py-6 flex justify-between items-center transition-colors duration-300">
    <div class="flex items-center gap-4 relative z-10">
        <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
        <h2 class="font-bold text-sm tracking-widest uppercase">Administration Protocol</h2>
    </div>

    <!-- THEME SWITCHER -->
    <div class="flex items-center border rounded-full p-1 text-xs font-bold uppercase tracking-wider border-current/25 relative z-10">
        <button onclick="setTheme('theme-light')" id="btn-light" class="px-3 py-1 rounded-full transition-all">Light</button>
        <button onclick="setTheme('theme-dark')" id="btn-dark" class="px-3 py-1 rounded-full transition-all">Dark</button>
    </div>

    <div class="flex items-center gap-6 relative z-10">
        <button onclick="handleLogout()" class="flex items-center gap-1 text-sm font-bold uppercase tracking-widest opacity-80 hover:opacity-100 transition-opacity text-red-500">
            <i data-lucide="log-out" class="w-4 h-4"></i> Logout
        </button>
        <a href="index.html" class="flex items-center gap-2 text-sm font-bold uppercase tracking-widest opacity-80 hover:opacity-100 transition-opacity">
            Home <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </a>
    </div>
</div>

<div class="max-w-7xl mx-auto w-full px-8 py-12 flex-1 relative z-10">
    <div class="flex gap-8 mb-12 border-b border-current/20">
        <button id="tab-shows" onclick="switchTab('shows')" class="pb-4 text-sm font-bold uppercase tracking-widest border-b-2 border-current transition-colors">Shows Directory</button>
        <button id="tab-contestants" onclick="switchTab('contestants')" class="pb-4 text-sm font-bold uppercase tracking-widest opacity-50 border-b-2 border-transparent hover:opacity-100 transition-colors">Contestants Directory</button>
    </div>

    <!-- SHOWS MODULE (SPLIT VIEW) -->
    <div id="shows-section" class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        <div class="lg:col-span-4">
            <div class="admin-card p-8 border shadow-sm transition-colors duration-300">
                <h3 class="text-xs font-bold uppercase tracking-widest mb-6 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Initialize New Show
                </h3>
                <form id="show-form" onsubmit="createShow(event)" class="flex flex-col gap-6">
                    <div><input type="text" id="show-title" class="admin-input" placeholder="SHOW TITLE" required></div>
                    <div><input type="text" id="show-desc" class="admin-input" placeholder="DESCRIPTION" required></div>
                    <div><input type="date" id="show-date" class="admin-input" required></div>
                    <div>
                        <select id="show-status" class="admin-input cursor-pointer bg-transparent">
                            <option value="UPCOMING" class="bg-zinc-900 text-white">UPCOMING</option>
                            <option value="ONGOING" class="bg-zinc-900 text-white">ONGOING</option>
                            <option value="COMPLETED" class="bg-zinc-900 text-white">COMPLETED</option>
                        </select>
                    </div>
                    <div><button type="submit" class="w-full bg-current text-background text-xs font-bold uppercase tracking-widest py-3 hover:opacity-90 transition-opacity" style="background-color: var(--tw-prose-invert-body, black); color: white;">Add Show</button></div>
                </form>
            </div>
        </div>

        <div class="lg:col-span-8">
            <h3 class="text-xs font-bold uppercase tracking-widest mb-4 opacity-80">Active Shows Archive</h3>
            <div class="overflow-x-auto admin-card p-6 border shadow-sm">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead>
                    <tr class="border-b-2 border-current/30 text-xs font-bold uppercase tracking-widest opacity-70">
                        <th class="py-4 pr-6">ID</th><th class="py-4 pr-6">Title</th><th class="py-4 pr-6">Description</th><th class="py-4 pr-6">Start Date</th><th class="py-4 pr-6">Status</th><th class="py-4 text-right">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="shows-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- CONTESTANTS MODULE (SPLIT VIEW) -->
    <div id="contestants-section" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        <div class="lg:col-span-4">
            <div class="admin-card p-8 border shadow-sm transition-colors duration-300">
                <h3 class="text-xs font-bold uppercase tracking-widest mb-6 flex items-center gap-2" id="contestant-form-title">
                    <i data-lucide="user-plus" class="w-4 h-4"></i> Register Contestant
                </h3>
                <form id="contestant-form" onsubmit="saveContestant(event)" class="flex flex-col gap-6">
                    <input type="hidden" id="cont-id">
                    <div><input type="text" id="cont-name" class="admin-input" placeholder="FULL NAME" required></div>
                    <div><input type="number" id="cont-age" class="admin-input" placeholder="AGE" required></div>
                    <div><input type="text" id="cont-bio" class="admin-input" placeholder="BIOGRAPHY / STYLE" required></div>
                    <div><input type="text" id="cont-photo" class="admin-input" placeholder="PHOTO URL (OPTIONAL)"></div>
                    <div>
                        <select id="cont-show-id" class="admin-input cursor-pointer bg-transparent" required>
                            <option value="" class="bg-zinc-900 text-white">SELECT SHOW...</option>
                        </select>
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" id="contestant-submit-btn" class="w-full bg-current text-background text-xs font-bold uppercase tracking-widest py-3 hover:opacity-90 transition-opacity" style="background-color: var(--tw-prose-invert-body, black); color: white;">Add Contestant</button>
                        <button type="button" id="contestant-cancel-btn" onclick="resetContestantForm()" class="hidden text-xs font-bold uppercase tracking-widest px-2 text-zinc-500 hover:text-black">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="lg:col-span-8">
            <h3 class="text-xs font-bold uppercase tracking-widest mb-4 opacity-80">Contestant Registry</h3>
            <div class="overflow-x-auto admin-card p-6 border shadow-sm">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead>
                    <tr class="border-b-2 border-current/30 text-xs font-bold uppercase tracking-widest opacity-70">
                        <th class="py-4 pr-6">ID</th><th class="py-4 pr-6">Visual</th><th class="py-4 pr-6">Name</th><th class="py-4 pr-6">Age</th><th class="py-4 pr-6 w-full">Bio</th><th class="py-4 pr-6">Show ID</th><th class="py-4 text-right">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="contestants-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();
    const API_BASE_URL = 'http://localhost:8080/api';

    // Theme Switcher Logic
    function setTheme(themeName) {
        const body = document.getElementById('site-body');
        body.className = `antialiased min-h-screen flex flex-col relative ${themeName}`;
        localStorage.setItem('preferred-theme', themeName);

        ['theme-light', 'theme-dark', 'theme-white'].forEach(t => {
            const btn = document.getElementById(t.replace('theme-', 'btn-'));
            if(btn) {
                if(t === themeName) {
                    btn.style.backgroundColor = 'currentColor';
                    btn.style.color = themeName === 'theme-dark' ? '#000' : '#fff';
                } else {
                    btn.style.backgroundColor = 'transparent';
                    btn.style.color = 'inherit';
                }
            }
        });
    }

    function handleLogout() {
        sessionStorage.removeItem('isAdminAuthenticated');
        window.location.href = 'login.html';
    }

    function switchTab(tab) {
        document.getElementById('shows-section').classList.add('hidden');
        document.getElementById('contestants-section').classList.add('hidden');
        document.getElementById('tab-shows').className = "pb-4 text-sm font-bold uppercase tracking-widest opacity-50 border-b-2 border-transparent hover:opacity-100 transition-colors";
        document.getElementById('tab-contestants').className = "pb-4 text-sm font-bold uppercase tracking-widest opacity-50 border-b-2 border-transparent hover:opacity-100 transition-colors";

        document.getElementById(`${tab}-section`).classList.remove('hidden');
        document.getElementById(`tab-${tab}`).className = "pb-4 text-sm font-bold uppercase tracking-widest border-b-2 border-current transition-colors";

        if(tab === 'shows') fetchShows();
        if(tab === 'contestants') { fetchContestants(); populateShowDropdown(); }
    }

    async function fetchShows() {
        try {
            const res = await fetch(`${API_BASE_URL}/shows`);
            renderShows(await res.json());
        } catch (e) { renderShows([]); }
    }

    function renderShows(shows) {
        const tbody = document.getElementById('shows-table-body');
        tbody.innerHTML = shows.length ? shows.map(s => `
                <tr class="border-b border-current/10 hover:opacity-100 transition-colors">
                    <td class="py-4 pr-6 font-mono text-xs">#${s.id}</td>
                    <td class="py-4 pr-6 font-medium">${s.title}</td>
                    <td class="py-4 pr-6 opacity-80 truncate max-w-[200px]">${s.description}</td>
                    <td class="py-4 pr-6 font-mono text-xs">${s.startDate}</td>
                    <td class="py-4 pr-6"><span class="${s.status === 'ONGOING' ? 'bg-current text-background' : 'bg-current/10'} px-2 py-1 text-[10px] font-bold uppercase tracking-widest" style="${s.status === 'ONGOING' ? 'background: currentColor; color: var(--bg);' : ''}">${s.status}</span></td>
                    <td class="py-4 text-right"><button class="text-xs font-bold uppercase tracking-widest text-red-500 hover:text-red-700 transition-colors" onclick="deleteShow(${s.id})">Terminate</button></td>
                </tr>`).join('') : `<tr><td colspan="6" class="py-8 text-center opacity-60 text-sm italic">No shows recorded.</td></tr>`;
    }

    async function createShow(event) {
        event.preventDefault();
        const newShow = { title: document.getElementById('show-title').value, description: document.getElementById('show-desc').value, startDate: document.getElementById('show-date').value, status: document.getElementById('show-status').value };
        try { await fetch(`${API_BASE_URL}/shows`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newShow) }); } catch(e){}
        document.getElementById('show-form').reset();
        fetchShows();
    }

    async function deleteShow(id) {
        if(confirm("Confirm deletion?")) {
            try { await fetch(`${API_BASE_URL}/shows/${id}`, { method: 'DELETE' }); } catch(e){}
            fetchShows();
        }
    }

    async function fetchContestants() {
        try {
            const res = await fetch(`${API_BASE_URL}/contestants`);
            renderContestants(await res.json());
        } catch (e) { renderContestants([]); }
    }

    let contestantsCache = [];

    function renderContestants(contestants) {
        contestantsCache = contestants;
        const tbody = document.getElementById('contestants-table-body');
        tbody.innerHTML = contestants.length ? contestants.map(c => {
            const img = c.photoUrl ? `<img src="${c.photoUrl}" class="w-10 h-10 rounded-full object-cover border border-current/20">` : `<div class="w-10 h-10 rounded-full bg-current/10 border border-current/20 flex items-center justify-center"><i data-lucide="user" class="w-4 h-4 opacity-50"></i></div>`;
            return `
                <tr class="border-b border-current/10 hover:opacity-100 transition-colors">
                    <td class="py-4 pr-6 font-mono text-xs">#${c.id}</td>
                    <td class="py-4 pr-6">${img}</td>
                    <td class="py-4 pr-6 font-medium">${c.name}</td>
                    <td class="py-4 pr-6 font-mono">${c.age}</td>
                    <td class="py-4 pr-6 opacity-80 truncate max-w-[250px]">${c.bio}</td>
                    <td class="py-4 pr-6 font-mono text-xs">REF-${c.showId}</td>
                    <td class="py-4 text-right space-x-3">
                        <button class="text-xs font-bold uppercase tracking-widest text-blue-500 hover:text-blue-700 transition-colors" onclick="editContestant(${c.id})">Edit</button>
                        <button class="text-xs font-bold uppercase tracking-widest text-red-500 hover:text-red-700 transition-colors" onclick="deleteContestant(${c.id})">Terminate</button>
                    </td>
                </tr>`;
        }).join('') : `<tr><td colspan="7" class="py-8 text-center opacity-60 text-sm italic">No contestants recorded.</td></tr>`;
        lucide.createIcons();
    }

    async function populateShowDropdown() {
        const dropdown = document.getElementById('cont-show-id');
        dropdown.innerHTML = '<option value="">SELECT SHOW...</option>';
        try {
            const res = await fetch(`${API_BASE_URL}/shows`);
            const shows = await res.json();
            shows.forEach(s => { dropdown.innerHTML += `<option value="${s.id}" class="bg-zinc-900 text-white">${s.title} (REF: ${s.id})</option>`; });
        } catch(e){}
    }

    async function saveContestant(event) {
        event.preventDefault();
        const id = document.getElementById('cont-id').value;
        const contData = {
            name: document.getElementById('cont-name').value,
            age: parseInt(document.getElementById('cont-age').value),
            bio: document.getElementById('cont-bio').value,
            photoUrl: document.getElementById('cont-photo').value,
            showId: parseInt(document.getElementById('cont-show-id').value)
        };

        try {
            if (id) {
                await fetch(`${API_BASE_URL}/contestants/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(contData)
                });
            } else {
                await fetch(`${API_BASE_URL}/contestants`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(contData)
                });
            }
        } catch(e) {
            console.error("Error saving contestant:", e);
        }

        resetContestantForm();
        fetchContestants();
    }

    function editContestant(id) {
        const cont = contestantsCache.find(c => c.id === id);
        if (!cont) return;

        document.getElementById('cont-id').value = cont.id;
        document.getElementById('cont-name').value = cont.name;
        document.getElementById('cont-age').value = cont.age;
        document.getElementById('cont-bio').value = cont.bio;
        document.getElementById('cont-photo').value = cont.photoUrl || '';
        document.getElementById('cont-show-id').value = cont.showId;

        document.getElementById('contestant-form-title').innerHTML = `<i data-lucide="user-check" class="w-4 h-4"></i> Edit Contestant (ID: #${cont.id})`;
        document.getElementById('contestant-submit-btn').innerText = 'Update';
        document.getElementById('contestant-cancel-btn').classList.remove('hidden');
        lucide.createIcons();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetContestantForm() {
        document.getElementById('contestant-form').reset();
        document.getElementById('cont-id').value = '';
        document.getElementById('contestant-form-title').innerHTML = `<i data-lucide="user-plus" class="w-4 h-4"></i> Register Contestant`;
        document.getElementById('contestant-submit-btn').innerText = 'Add Contestant';
        document.getElementById('contestant-cancel-btn').classList.add('hidden');
        lucide.createIcons();
    }

    async function deleteContestant(id) {
        if(confirm("Confirm termination?")) {
            try { await fetch(`${API_BASE_URL}/contestants/${id}`, { method: 'DELETE' }); } catch(e){}
            fetchContestants();
        }
    }

    window.onload = () => {
        // Enforce Authentication Gate
        if (sessionStorage.getItem('isAdminAuthenticated') !== 'true') {
            window.location.href = 'login.html';
            return;
        }

        const savedTheme = localStorage.getItem('preferred-theme') || 'theme-light';
        setTheme(savedTheme);
        fetchShows();
    };
</script>
</body>
</html>
