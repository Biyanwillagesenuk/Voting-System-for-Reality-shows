<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reality Show Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            display: flex;
            height: 100vh;
            background: linear-gradient(135deg, #2d1052 0%, #4a154b 50%, #681d6e 100%);
            color: #fff;
            overflow: hidden;
        }
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
            background: radial-gradient(circle at top left, rgba(147, 51, 234, 0.3), transparent);
        }
        .left-panel h1 { font-size: 56px; font-weight: 700; margin-bottom: 10px; }
        .left-panel p { font-size: 20px; color: #d8b4fe; font-weight: 300; }
        .right-panel {
            width: 520px;
            background: rgba(43, 16, 85, 0.85);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 35px;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            border-left: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
        }
        .form-title { font-size: 24px; margin-bottom: 20px; color: #f3e8ff; font-weight: 600; text-align: center; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; color: #c084fc; margin-bottom: 5px; }
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(192, 132, 252, 0.3);
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .input-group select option { background: #2d1052; color: #fff; }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #7e22ce, #a855f7);
            border: none;
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-danger { background: linear-gradient(90deg, #dc2626, #ef4444); }
        .footer-links { text-align: center; margin-top: 20px; font-size: 13px; color: #d8b4fe; }
        .footer-links a { color: #fff; text-decoration: underline; cursor: pointer; font-weight: 600; }
        .error-card {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid #ef4444;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
        }
        .hidden { display: none; }

        /* Admin Table Styles */
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .admin-table-container {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid rgba(192, 132, 252, 0.3);
            border-radius: 10px;
        }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        th, td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { background: rgba(126, 34, 206, 0.5); color: #f3e8ff; sticky: top; }
        .btn-del {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
        }
    </style>
</head>
<body>

<div class="left-panel">
    <h1>Welcome</h1>
    <p>Have a great journey ahead...</p>
</div>

<div class="right-panel">

    <!-- SIGN IN FORM -->
    <div id="loginFormContainer">
        <h2 class="form-title">SIGN IN</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>Role</label>
                <select id="loginRole" required>
                    <option value="VOTER">Voter</option>
                    <option value="ADMIN">Admin</option>
                    <option value="CONTESTANT">Contestant</option>
                    <option value="JUDGE">Judge</option>
                </select>
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="john@example.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">SIGN IN</button>
        </form>
        <div class="footer-links">
            <p>Don't have an account? <a onclick="showView('registerFormContainer')">Sign Up</a></p>
            <p style="margin-top: 8px;"><a onclick="showView('forgotPasswordContainer')">Forgot Password</a></p>
        </div>
    </div>

    <!-- INCORRECT PASSWORD / ERROR SCREEN -->
    <div id="errorContainer" class="hidden">
        <div class="error-card">
            <h3 style="color: #fca5a5; margin-bottom: 8px;">⚠️ Authentication Failed</h3>
            <p id="errorMessage" style="font-size: 14px; color: #fecaca;"></p>
        </div>
        <button class="btn-submit" onclick="showView('loginFormContainer')">Try Again</button>
        <button class="btn-submit btn-danger" style="margin-top: 10px;" onclick="showView('forgotPasswordContainer')">Forgot Password?</button>
    </div>

    <!-- FORGOT PASSWORD SCREEN -->
    <div id="forgotPasswordContainer" class="hidden">
        <h2 class="form-title">RESET PASSWORD</h2>
        <form id="forgotForm">
            <div class="input-group">
                <label>Enter Registered Email</label>
                <input type="email" id="resetEmail" placeholder="john@example.com" required>
            </div>
            <button type="submit" class="btn-submit">SEND RESET LINK</button>
        </form>
        <div class="footer-links">
            <p><a onclick="showView('loginFormContainer')">Back to Sign In</a></p>
        </div>
    </div>

    <!-- REGISTER / ADD USER FORM -->
    <div id="registerFormContainer" class="hidden">
        <h2 class="form-title" id="regTitle">CREATE ACCOUNT</h2>
        <form id="registerForm">
            <div class="input-group">
                <label>Select Role</label>
                <select id="regRole" onchange="handleRoleChange()" required>
                    <option value="VOTER">Voter</option>
                    <option value="ADMIN">Admin</option>
                    <option value="CONTESTANT">Contestant</option>
                    <option value="JUDGE">Judge</option>
                </select>
            </div>
            <div class="input-group hidden" id="showIdGroup">
                <label>Show ID</label>
                <input type="text" id="regShowId" placeholder="e.g. SHOW-101">
            </div>
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="John Doe" required>
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="regEmail" placeholder="john@example.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="••••••••" required>
            </div>
            <div class="input-group">
                <label>Phone Number (Exactly 10 Digits)</label>
                <input type="tel"
                       id="regPhone"
                       placeholder="0712345678"
                       minlength="10"
                       maxlength="10"
                       pattern="[0-9]{10}"
                       title="Phone number must be exactly 10 digits"
                       oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                       required>
            </div>
            <button type="submit" class="btn-submit" id="regSubmitBtn">REGISTER</button>
        </form>
        <div class="footer-links" id="regBackLink">
            <p>Already have an account? <a onclick="showView('loginFormContainer')">Sign In</a></p>
        </div>
    </div>

    <!-- ADMIN DASHBOARD PANEL -->
    <div id="adminDashboardContainer" class="hidden">
        <div class="admin-header">
            <h2>Admin Control</h2>
            <button class="btn-del" onclick="logoutAdmin()">Logout</button>
        </div>
        <p style="font-size: 13px; color: #d8b4fe; margin-bottom: 15px;">Manage users in the system</p>

        <button class="btn-submit" style="margin-bottom: 15px;" onclick="openAddUserFromAdmin()">+ Add New User</button>

        <div class="admin-table-container">
            <table>
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="userTableBody">
                <!-- Loaded dynamically -->
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    const API_URL = 'http://localhost:8080/api/users';
    let isAdminSession = false;

    function showView(viewId) {
        ['loginFormContainer', 'registerFormContainer', 'errorContainer', 'forgotPasswordContainer', 'adminDashboardContainer'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
        document.getElementById(viewId).classList.remove('hidden');
    }

    function handleRoleChange() {
        const role = document.getElementById('regRole').value;
        const showIdGroup = document.getElementById('showIdGroup');
        const showIdInput = document.getElementById('regShowId');

        if (role === 'ADMIN' || role === 'CONTESTANT' || role === 'JUDGE') {
            showIdGroup.classList.remove('hidden');
            showIdInput.required = true;
        } else {
            showIdGroup.classList.add('hidden');
            showIdInput.required = false;
        }
    }

    // SIGN IN LOGIC
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const loginData = {
            role: document.getElementById('loginRole').value,
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
        };

        try {
            const response = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(loginData)
            });

            const data = await response.json();

            if (response.ok) {
                if (data.role.toUpperCase() === 'ADMIN') {
                    isAdminSession = true;
                    loadAllUsers();
                    showView('adminDashboardContainer');
                } else {
                    alert(`Welcome back, ${data.name}! Logged in as ${data.role}.`);
                }
            } else {
                document.getElementById('errorMessage').innerText = data.message || 'Incorrect credentials.';
                showView('errorContainer');
            }
        } catch (err) {
            document.getElementById('errorMessage').innerText = 'Could not connect to database server.';
            showView('errorContainer');
        }
    });

    // ADMIN USER MANAGEMENT
    async function loadAllUsers() {
        try {
            const response = await fetch(API_URL);
            const users = await response.json();
            const tableBody = document.getElementById('userTableBody');
            tableBody.innerHTML = '';

            users.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>${user.role}</td>
                    <td><button class="btn-del" onclick="deleteUser(${user.uid})">Delete</button></td>
                `;
                tableBody.appendChild(tr);
            });
        } catch (err) {
            alert('Failed to fetch user list.');
        }
    }

    async function deleteUser(id) {
        if (!confirm('Are you sure you want to delete this user?')) return;

        try {
            const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            if (response.ok) {
                alert('User deleted!');
                loadAllUsers();
            } else {
                alert('Failed to delete user.');
            }
        } catch (err) {
            alert('Error deleting user.');
        }
    }

    function openAddUserFromAdmin() {
        document.getElementById('regTitle').innerText = 'ADD USER';
        document.getElementById('regSubmitBtn').innerText = 'ADD USER';
        document.getElementById('regBackLink').innerHTML = `<p><a onclick="showView('adminDashboardContainer')">Back to Dashboard</a></p>`;
        showView('registerFormContainer');
    }

    function logoutAdmin() {
        isAdminSession = false;
        document.getElementById('loginForm').reset();
        showView('loginFormContainer');
    }

    // REGISTER / ADD USER SUBMIT HANDLER
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const phoneNum = document.getElementById('regPhone').value.trim();
        if (phoneNum.length !== 10) {
            alert('Phone number must be exactly 10 digits!');
            return;
        }

        const userData = {
            name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            passwordHash: document.getElementById('regPassword').value,
            phoneNum: phoneNum,
            role: document.getElementById('regRole').value,
            showId: document.getElementById('regShowId').value || null
        };

        try {
            const response = await fetch(`${API_URL}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData)
            });

            if (response.ok) {
                alert('User account created successfully!');
                document.getElementById('registerForm').reset();
                if (isAdminSession) {
                    loadAllUsers();
                    showView('adminDashboardContainer');
                } else {
                    showView('loginFormContainer');
                }
            } else {
                const error = await response.json();
                alert('Registration Failed: ' + (error.message || JSON.stringify(error)));
            }
        } catch (err) {
            alert('Server connection error!');
        }
    });

    // FORGOT PASSWORD LOGIC
    document.getElementById('forgotForm').addEventListener('submit', (e) => {
        e.preventDefault();
        alert('A password reset link has been sent to ' + document.getElementById('resetEmail').value);
        showView('loginFormContainer');
    });
</script>
</body>
</html>
