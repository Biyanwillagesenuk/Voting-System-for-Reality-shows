<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cast Vote - Reality Show Voting System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { overflow-x: hidden; transition: background-color 0.4s ease, color 0.4s ease; }
        ::selection { background: currentColor; color: background; }

        .admin-select { width: 100%; background: transparent; border-bottom: 1px solid; border-color: inherit; padding: 0.75rem 0; font-size: 0.875rem; outline: none; opacity: 0.8; cursor: pointer; }

        body.theme-light { background-color: #f2f2f2; color: #000000; }
        body.theme-light .admin-header { background-color: rgba(242, 242, 242, 0.85); border-color: #e4e4e7; }
        body.theme-light .admin-card { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-color: #e4e4e7; }
        body.theme-light .admin-select option { background: #fff; color: #000; }

        body.theme-dark { background-color: #050609; color: #f2f2f2; }
        body.theme-dark .admin-header { background-color: rgba(5, 6, 9, 0.85); border-color: #27272a; }
        body.theme-dark .admin-card { background-color: rgba(18, 19, 22, 0.9); backdrop-filter: blur(12px); border-color: #27272a; }
        body.theme-dark .admin-select option { background: #121316; color: #fff; }

        body.theme-white { background-color: #ffffff; color: #09090b; }
        body.theme-white .admin-header { background-color: rgba(255, 255, 255, 0.85); border-color: #f4f4f5; }
        body.theme-white .admin-card { background-color: rgba(249, 249, 251, 0.9); backdrop-filter: blur(12px); border-color: #f4f4f5; }
        body.theme-white .admin-select option { background: #fff; color: #000; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col theme-light relative" id="site-body">

<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-10">
    <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=1600&q=80" alt="Background" class="w-full h-full object-cover grayscale mix-blend-multiply">
</div>

<!-- HEADER -->
<div class="admin-header sticky top-0 backdrop-blur-md z-50 border-b px-8 py-6 flex justify-between items-center transition-colors duration-300">
    <div class="flex items-center gap-4 relative z-10">
        <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
        <h2 class="font-bold text-sm tracking-widest uppercase">Secure Voting Portal</h2>
    </div>

    <div class="flex items-center border rounded-full p-1 text-xs font-bold uppercase tracking-wider border-current/25 relative z-10">
        <button onclick="setTheme('theme-light')" id="btn-light" class="px-3 py-1 rounded-full transition-all cursor-pointer">Light</button>
        <button onclick="setTheme('theme-dark')" id="btn-dark" class="px-3 py-1 rounded-full transition-all cursor-pointer">Dark</button>
    </div>

    <div class="flex items-center gap-6 relative z-10">
        <div id="auth-nav-container"></div>
        <a href="index.html" class="flex items-center gap-2 text-sm font-bold uppercase tracking-widest opacity-80 hover:opacity-100 transition-opacity">
            Home <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </a>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="max-w-5xl mx-auto w-full px-8 py-12 flex-1 relative z-10">
    <div class="mb-10 text-center">
        <h1 class="text-3xl font-bold tracking-tight mb-2">Cast Your Vote</h1>
        <p class="opacity-60 text-sm">Select an active show, pick your favorite contestant, and securely submit your vote.</p>
    </div>

    <!-- SHOW SELECTOR CARD -->
    <div class="admin-card p-6 border shadow-sm mb-8 rounded-xl flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="w-full md:w-1/3">
            <label class="block text-[10px] font-mono uppercase tracking-widest opacity-70 mb-1">Select Active Show:</label>
            <select id="show-select" class="admin-select font-mono" onchange="onShowSelected(this.value)">
                <option value="">LOADING SHOWS...</option>
            </select>
        </div>
        <div id="voting-status-banner" class="w-full md:w-auto text-xs font-mono uppercase tracking-widest px-4 py-2 rounded border border-current/20 bg-current/5 text-center">
            Select a show to begin
        </div>
    </div>

    <!-- CONTESTANTS GRID -->
    <div id="contestants-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full py-16 text-center opacity-60 text-sm italic font-mono">
            Please choose a show above to view competing contestants.
        </div>
    </div>
</div>

<script>
    lucide.createIcons();
    const API_ROOT = 'http://localhost:8080/api';
    let selectedShowId = null;
    let selectedContestantId = null;

    const Auth = {
        get(key) {
            try {
                const v = sessionStorage.getItem(key) ?? localStorage.getItem(key);
                return (v === 'undefined' || v === 'null') ? null : v;
            } catch { return null; }
        },
        get isLoggedIn() { return this.get('isLoggedIn') === 'true' && !!this.get('userId'); },
        get userId()     { return this.get('userId'); },
        get userName()   { return this.get('userName') || 'User'; },
        get role()       { return (this.get('userRole') || '').toUpperCase().replace('ROLE_', ''); }
    };

    function updateHeaderAuthUI() {
        const authContainer = document.getElementById('auth-nav-container');
        if (!authContainer) return;

        if (Auth.isLoggedIn) {
            authContainer.innerHTML = `
                <span class="flex items-center gap-2 text-xs font-mono uppercase tracking-widest px-4 py-2 border border-current/20 rounded-full">
                    <i data-lucide="user" class="w-4 h-4"></i> ${Auth.userName} (${Auth.role})
                </span>`;
        } else {
            authContainer.innerHTML = `
                <a href="user-portal.html" class="flex items-center gap-2 text-sm font-bold uppercase tracking-widest px-4 py-2 border border-current/20 rounded-full hover:bg-current/10 transition-all">
                    Login to Vote
                </a>`;
        }
        if (window.lucide) lucide.createIcons();
    }

    function setTheme(themeName) {
        const body = document.getElementById('site-body');
        body.className = `antialiased min-h-screen flex flex-col relative ${themeName}`;
        localStorage.setItem('preferred-theme', themeName);

        ['theme-light', 'theme-dark', 'theme-white'].forEach(t => {
            const btn = document.getElementById(t.replace('theme-', 'btn-'));
            if(btn) {
                btn.style.backgroundColor = t === themeName ? 'currentColor' : 'transparent';
                btn.style.color = t === themeName ? (themeName === 'theme-dark' ? '#000' : '#fff') : 'inherit';
            }
        });
    }

    async function fetchShows() {
        const dropdown = document.getElementById('show-select');
        try {
            const res = await fetch(`${API_ROOT}/shows`);
            if (!res.ok) throw new Error("Failed to load shows");
            const shows = await res.json();

            const activeShows = shows.filter(s => s.status === 'ONGOING');
            if (activeShows.length === 0) {
                dropdown.innerHTML = '<option value="">No ongoing shows available</option>';
                return;
            }

            dropdown.innerHTML = '<option value="">-- SELECT SHOW --</option>';
            activeShows.forEach(s => {
                dropdown.innerHTML += `<option value="${s.id}">${s.title} (ID: #${s.id})</option>`;
            });
        } catch (e) {
            dropdown.innerHTML = '<option value="">Error loading shows</option>';
        }
    }

    async function onShowSelected(showId) {
        selectedShowId = showId;
        const container = document.getElementById('contestants-container');
        const banner = document.getElementById('voting-status-banner');

        if (!showId) {
            container.innerHTML = `<div class="col-span-full py-16 text-center opacity-60 text-sm italic font-mono">Please choose a show above to view competing contestants.</div>`;
            banner.innerText = "Select a show to begin";
            return;
        }

        if (!Auth.isLoggedIn) {
            banner.innerHTML = `<span class="text-red-500 font-bold">Authentication Required: Please <a href="user-portal.html" class="underline">Login</a> to check vote status and submit votes.</span>`;
        } else {
            // Check if user has already voted in this show
            try {
                const res = await fetch(`${API_ROOT}/votes/check?userId=${Auth.userId}&showId=${showId}`);
                if (res.ok) {
                    const json = await res.json();
                    const hasVoted = json.data?.hasVoted;
                    if (hasVoted) {
                        banner.innerHTML = `<span class="text-amber-500 font-bold">You have already cast your vote in this show.</span>`;
                    } else {
                        banner.innerHTML = `<span class="text-green-500 font-bold">Eligible to Vote</span>`;
                    }
                }
            } catch (e) {
                banner.innerText = "Ready to vote";
            }
        }

        // Fetch Contestants for this Show
        container.innerHTML = `<div class="col-span-full py-12 text-center opacity-60 text-sm italic font-mono">Loading contestants...</div>`;
        try {
            const res = await fetch(`${API_ROOT}/contestants?showId=${showId}`);
            if (!res.ok) throw new Error("Failed to load contestants");
            const contestants = await res.json();

            // Filter contestants belonging to this show if endpoint returns all
            const showContestants = contestants.filter(c => String(c.showId) === String(showId));

            if (showContestants.length === 0) {
                container.innerHTML = `<div class="col-span-full py-12 text-center opacity-60 text-sm italic font-mono">No contestants registered for this show yet.</div>`;
                return;
            }

            container.innerHTML = showContestants.map(c => `
                <div class="admin-card p-6 border rounded-xl flex flex-col justify-between shadow-sm">
                    <div>
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-[10px] font-mono uppercase tracking-widest opacity-60">ID: #${c.id}</span>
                            <span class="text-[10px] font-mono uppercase tracking-widest px-2 py-0.5 border rounded-full border-current/20">Age ${c.age}</span>
                        </div>
                        <div class="flex items-center gap-4 mb-4">
                            ${c.photoUrl ? `<img src="${c.photoUrl}" class="w-14 h-14 rounded-full object-cover border border-current/20">` : `<div class="w-14 h-14 rounded-full bg-current/10 border border-current/20 flex items-center justify-center font-bold text-lg">${c.name.charAt(0)}</div>`}
                            <div>
                                <h3 class="font-bold text-lg uppercase tracking-tight">${c.name}</h3>
                                <p class="text-xs opacity-70 line-clamp-2 mt-1">${c.bio || 'No bio provided.'}</p>
                            </div>
                        </div>
                    </div>
                    <button onclick="castVoteForContestant(${c.id})" class="w-full bg-current text-background text-xs font-bold uppercase tracking-widest py-3 mt-4 transition-opacity hover:opacity-90 cursor-pointer rounded" style="background-color: var(--tw-prose-invert-body, black); color: white;">
                        Cast Vote
                    </button>
                </div>
            `).join('');
            if (window.lucide) lucide.createIcons();
        } catch (e) {
            container.innerHTML = `<div class="col-span-full py-12 text-center text-red-500 text-sm italic font-mono">Unable to retrieve contestants from backend.</div>`;
        }
    }

    async function castVoteForContestant(contestantId) {
        if (!Auth.isLoggedIn) {
            alert("You must be logged in as a user to cast a vote.");
            window.location.href = 'user-portal.html';
            return;
        }

        if (!selectedShowId) {
            alert("Please select an active show first.");
            return;
        }

        if (!confirm(`Confirm your vote for contestant #${contestantId}? This action is final.`)) {
            return;
        }

        const payload = {
            userId: parseInt(Auth.userId),
            showId: parseInt(selectedShowId),
            contestantId: parseInt(contestantId)
        };

        try {
            const res = await fetch(`${API_ROOT}/votes`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await res.json();
            if (res.ok) {
                alert("Vote submitted successfully!");
                onShowSelected(selectedShowId); // Refresh state
            } else {
                alert(result.message || "Failed to submit vote. You may have already voted in this show.");
            }
        } catch (e) {
            alert("Network error connecting to the voting service.");
        }
    }

    window.onload = () => {
        setTheme(localStorage.getItem('preferred-theme') || 'theme-light');
        updateHeaderAuthUI();
        fetchShows();
    };
</script>
</body>
</html>
