<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sponsor Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <img th:src="@{/images/logo.png}" alt="Show logo" style="height: 60px; width: auto;">
        </a>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/sponsors}">Sponsors</a>
            <a class="nav-link" th:href="@{/contestants}">Contestants</a>
            <a class="nav-link" th:href="@{/voting}">Voting</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2 th:text="${sponsor.id == null} ? 'Add Sponsor' : 'Edit Sponsor'">Sponsor Form</h2>

    <form th:action="@{/sponsors}" th:object="${sponsor}" method="post" class="row g-3 mt-2">

        <input type="hidden" th:field="*{id}" />

        <div class="col-md-6">
            <label class="form-label">Company Name</label>
            <input type="text" th:field="*{companyName}" class="form-control"
                   th:classappend="${#fields.hasErrors('companyName')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Contact Person</label>
            <input type="text" th:field="*{contactPersonName}" class="form-control" />
        </div>

        <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input type="text" th:field="*{phone}" class="form-control" />
        </div>

        <div class="col-md-4">
            <label class="form-label">Tier</label>
            <select th:field="*{tier}" class="form-select"
                    th:classappend="${#fields.hasErrors('tier')} ? 'is-invalid'">
                <option value="">-- Select Tier --</option>
                <option th:each="t : ${tiers}" th:value="${t}" th:text="${t}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('tier')}" th:errors="*{tier}"></div>
        </div>

        <div class="col-md-4">
            <label class="form-label">Payment Status</label>
            <select th:field="*{paymentStatus}" class="form-select">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label">Amount</label>
            <input type="number" step="0.01" th:field="*{amount}" class="form-control"
                   th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
        </div>

        <div class="col-md-6">
            <label class="form-label">Contract Start Date</label>
            <input type="date" th:field="*{contractStartDate}" class="form-control" />
        </div>

        <div class="col-md-6">
            <label class="form-label">Contract End Date</label>
            <input type="date" th:field="*{contractEndDate}" class="form-control" />
        </div>

        <div class="col-12 form-check mt-3">
            <input type="checkbox" th:field="*{active}" class="form-check-input" />
            <label class="form-check-label">Active</label>
        </div>

        <div class="col-12 mt-3">
            <button type="submit" class="btn btn-primary">Save Sponsor</button>
            <a th:href="@{/sponsors}" class="btn btn-outline-secondary">Cancel</a>
        </div>

    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
