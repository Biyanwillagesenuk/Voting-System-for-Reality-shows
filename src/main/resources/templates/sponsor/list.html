<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sponsors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <img th:src="@{/images/logo.png}" alt="Show logo" style="height: 60px; width: auto;">
        </a>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/sponsors}">Sponsors</a>
            <a class="nav-link" th:href="@{/contestants}">Contestants</a>
            <a class="nav-link" th:href="@{/voting}">Voting</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Sponsor Management</h2>
        <a th:href="@{/sponsors/new}" class="btn btn-primary">+ Add Sponsor</a>
    </div>

    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>Company</th>
                <th>Tier</th>
                <th>Contact</th>
                <th>Payment Status</th>
                <th>Active</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="sponsor : ${sponsors}">
                <td th:text="${sponsor.companyName}">Company</td>
                <td>
                    <span class="badge"
                          th:classappend="${sponsor.tier.name() == 'GOLD'} ? 'bg-warning text-dark' : (${sponsor.tier.name() == 'SILVER'} ? 'bg-secondary' : 'bg-danger')"
                          th:text="${sponsor.tier}">Tier</span>
                </td>
                <td th:text="${sponsor.contactPersonName}">Contact</td>
                <td>
                    <span class="badge"
                          th:classappend="${sponsor.paymentStatus.name() == 'PAID'} ? 'bg-success' : (${sponsor.paymentStatus.name() == 'PENDING'} ? 'bg-warning text-dark' : 'bg-danger')"
                          th:text="${sponsor.paymentStatus}">Status</span>
                </td>
                <td>
                    <span th:if="${sponsor.active}" class="badge bg-success">Active</span>
                    <span th:unless="${sponsor.active}" class="badge bg-secondary">Inactive</span>
                </td>
                <td>
                    <a th:href="@{/sponsors/{id}(id=${sponsor.id})}" class="btn btn-sm btn-outline-primary">View</a>
                    <a th:href="@{/sponsors/{id}/edit(id=${sponsor.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                    <form th:action="@{/sponsors/{id}/delete(id=${sponsor.id})}" method="post" style="display:inline"
                          onsubmit="return confirm('Delete this sponsor? This cannot be undone.');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(sponsors)}">
                <td colspan="6" class="text-center text-muted">No sponsors yet. Click "Add Sponsor" to create one.</td>
            </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
