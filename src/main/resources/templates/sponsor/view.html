<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sponsor Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <img th:src="@{/images/logo.png}" alt="Show logo" style="height: 60px; width: auto;">
        </a>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/sponsors}">Sponsors</a>
            <a class="nav-link" th:href="@{/contestants}">Contestants</a>
            <a class="nav-link" th:href="@{/voting}">Voting</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card">
        <div class="card-body">
            <h2 class="card-title" th:text="${sponsor.companyName}">Company Name</h2>
            <span class="badge bg-info text-dark mb-3" th:text="${sponsor.tier}">Tier</span>

            <table class="table table-borderless">
                <tr><th>Contact Person</th><td th:text="${sponsor.contactPersonName}"></td></tr>
                <tr><th>Email</th><td th:text="${sponsor.email}"></td></tr>
                <tr><th>Phone</th><td th:text="${sponsor.phone}"></td></tr>
                <tr><th>Payment Status</th><td th:text="${sponsor.paymentStatus}"></td></tr>
                <tr><th>Amount</th><td th:text="${sponsor.amount}"></td></tr>
                <tr><th>Contract Start</th><td th:text="${sponsor.contractStartDate}"></td></tr>
                <tr><th>Contract End</th><td th:text="${sponsor.contractEndDate}"></td></tr>
                <tr><th>Active</th><td th:text="${sponsor.active} ? 'Yes' : 'No'"></td></tr>
            </table>

            <a th:href="@{/sponsors/{id}/edit(id=${sponsor.id})}" class="btn btn-secondary">Edit</a>
            <a th:href="@{/sponsors}" class="btn btn-outline-secondary">Back to list</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
