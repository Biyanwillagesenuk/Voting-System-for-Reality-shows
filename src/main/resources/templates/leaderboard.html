<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cast Your Vote - Voting System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { overflow-x: hidden; transition: background-color 0.4s ease, color 0.4s ease; }
        ::selection { background: currentColor; color: background; }

        .admin-input { width: 100%; background: transparent; border-bottom: 1px solid; border-color: inherit; padding: 0.75rem 0; font-size: 1rem; transition: all 0.3s ease; outline: none; border-radius: 0; opacity: 0.8; }
        .admin-input:focus { opacity: 1; border-color: currentColor; }
        .admin-input option { background: #121316; color: #fff; }

        /* Theme Styles with Glassmorphism */
        body.theme-light { background-color: #f2f2f2; color: #000000; }
        body.theme-light .admin-header { background-color: rgba(242, 242, 242, 0.85); border-color: #e4e4e7; }
        body.theme-light .admin-card { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-color: #e4e4e7; }
        body.theme-light .admin-input option { background: #fff; color: #000; }

        body.theme-dark { background-color: #050609; color: #f2f2f2; }
        body.theme-dark .admin-header { background-color: rgba(5, 6, 9, 0.85); border-color: #27272a; }
        body.theme-dark .admin-card { background-color: rgba(18, 19, 22, 0.9); backdrop-filter: blur(12px); border-color: #27272a; }

        body.theme-white { background-color: #ffffff; color: #09090b; }
        body.theme-white .admin-header { background-color: rgba(255, 255, 255, 0.85); border-color: #f4f4f5; }
        body.theme-white .admin-card { background-color: rgba(249, 249, 251, 0.9); backdrop-filter: blur(12px); border-color: #f4f4f5; }
        body.theme-white .admin-input option { background: #fff; color: #000; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col theme-light relative" id="site-body">

<!-- AMBIENT BACKGROUND OVERLAY -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-10">
    <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=1600&q=80" alt="Ambient Stage Background" class="w-full h-full object-cover grayscale mix-blend-multiply">
</div>

<!-- TOP CONTROLS BAR -->
<div class="admin-header sticky top-0 backdrop-blur-md z-50 border-b px-8 py-6 flex justify-between items-center transition-colors duration-300">
    <div class="flex items-center gap-4 relative z-10">
        <div class="w-3 h-3 bg-blue-500 rounded-full animate-pulse"></div>
        <h2 class="font-bold text-sm tracking-widest uppercase">Voting Arena</h2>
    </div>

    <!-- THEME SWITCHER -->
    <div class="flex items-center border rounded-full p-1 text-xs font-bold uppercase tracking-wider border-current/25 relative z-10">
        <button onclick="setTheme('theme-light')" id="btn-light" class="px-3 py-1 rounded-full transition-all cursor-pointer">Light</button>
        <button onclick="setTheme('theme-dark')" id="btn-dark" class="px-3 py-1 rounded-full transition-all cursor-pointer">Dark</button>
    </div>

    <div class="flex items-center gap-6 relative z-10">
        <button onclick="Auth.logout()" class="flex items-center gap-1 text-sm font-bold uppercase tracking-widest opacity-80 hover:opacity-100 transition-opacity text-red-500 cursor-pointer">
            <i data-lucide="log-out" class="w-4 h-4"></i> Logout
        </button>
        <a href="index.html" class="flex items-center gap-2 text-sm font-bold uppercase tracking-widest opacity-80 hover:opacity-100 transition-opacity cursor-pointer z-20">
            Home <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </a>
    </div>
</div>

<div class="max-w-2xl mx-auto w-full px-6 py-12 flex-1 relative z-10 flex flex-col items-center justify-center">

    <div class="text-center mb-10">
        <h1 class="text-3xl font-bold tracking-tight mb-2">Cast Your Vote</h1>
        <p class="opacity-60 text-sm">Select an active show, choose your contestant, and submit your secure vote.</p>
        <div id="vote-status-banner" class="mt-4 text-xs font-mono uppercase tracking-wider px-4 py-2 rounded border border-current/20 bg-current/5 inline-block">
            Checking eligibility...
        </div>
    </div>

    <!-- VOTING CARD -->
    <div class="admin-card w-full p-10 border shadow-2xl transition-colors duration-300 rounded-lg">

        <!-- DYNAMIC CONTESTANT PICTURE -->
        <div class="flex justify-center mb-8">
            <div id="contestant-img-container" class="w-40 h-40 rounded-full border-4 border-current/10 flex items-center justify-center overflow-hidden bg-current/5 shadow-inner transition-all duration-300">
                <i data-lucide="user" class="w-16 h-16 opacity-30"></i>
            </div>
        </div>

        <form id="voting-form" onsubmit="castVote(event)" class="flex flex-col gap-6">
            <div>
                <label class="block text-xs font-mono uppercase opacity-60 mb-1">Select Active Show</label>
                <select class="admin-input cursor-pointer bg-transparent font-medium" id="show-select" onchange="onShowSelected(this.value)" required>
                    <option value="" class="bg-zinc-900 text-white">Loading shows...</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-mono uppercase opacity-60 mb-1">Select Contestant</label>
                <select class="admin-input cursor-pointer bg-transparent font-medium" id="candidateId" name="candidateId" onchange="updateContestantImage()" required>
                    <option value="" class="bg-zinc-900 text-white">-- Select a Show First --</option>
                </select>
            </div>

            <button type="submit" id="submit-vote-btn" class="w-full bg-current text-background text-sm font-bold uppercase tracking-widest py-4 hover:opacity-90 transition-opacity mt-4 cursor-pointer" style="background-color: var(--tw-prose-invert-body, black); color: white;">
                Submit Vote
            </button>
        </form>
    </div>
</div>

<script>
    lucide.createIcons();
    const API_ROOT = 'http://localhost:8080/api';
    let contestantsList = [];

    function setTheme(themeName) {
        const body = document.getElementById('site-body');
        body.className = `antialiased min-h-screen flex flex-col relative ${themeName}`;
        localStorage.setItem('preferred-theme', themeName);

        ['theme-light', 'theme-dark', 'theme-white'].forEach(t => {
            const btn = document.getElementById(t.replace('theme-', 'btn-'));
            if(btn) {
                if(t === themeName) {
                    btn.style.backgroundColor = 'currentColor';
                    btn.style.color = themeName === 'theme-dark' ? '#000' : '#fff';
                } else {
                    btn.style.backgroundColor = 'transparent';
                    btn.style.color = 'inherit';
                }
            }
        });
    }

    async function loadShows() {
        const dropdown = document.getElementById('show-select');
        try {
            const res = await fetch(`${API_ROOT}/shows`);
            if (!res.ok) throw new Error("Failed to load shows");
            const shows = await res.json();

            const activeShows = shows.filter(s => s.status === 'ONGOING');
            if (activeShows.length === 0) {
                dropdown.innerHTML = '<option value="" class="bg-zinc-900 text-white">No ongoing shows available</option>';
                return;
            }

            dropdown.innerHTML = '<option value="" class="bg-zinc-900 text-white">-- SELECT SHOW --</option>';
            activeShows.forEach(s => {
                dropdown.innerHTML += `<option value="${s.id}" class="bg-zinc-900 text-white">${s.title} (ID: #${s.id})</option>`;
            });
        } catch (e) {
            dropdown.innerHTML = '<option value="" class="bg-zinc-900 text-white">Error loading shows</option>';
        }
    }

    async function onShowSelected(showId) {
        const select = document.getElementById('candidateId');
        const banner = document.getElementById('vote-status-banner');
        const submitBtn = document.getElementById('submit-vote-btn');

        if (!showId) {
            select.innerHTML = '<option value="" class="bg-zinc-900 text-white">-- Select a Show First --</option>';
            banner.innerText = "Select a show to begin";
            return;
        }

        // Check if user already voted in this show
        try {
            const res = await fetch(`${API_ROOT}/votes/check?userId=${Auth.userId}&showId=${showId}`);
            if (res.ok) {
                const json = await res.json();
                const hasVoted = json.data?.hasVoted;
                if (hasVoted) {
                    banner.innerHTML = `<span class="text-amber-500 font-bold">You have already cast your vote in this show.</span>`;
                    submitBtn.disabled = true;
                    submitBtn.style.opacity = '0.5';
                    submitBtn.style.cursor = 'not-allowed';
                } else {
                    banner.innerHTML = `<span class="text-green-500 font-bold">Eligible to Vote</span>`;
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                    submitBtn.style.cursor = 'pointer';
                }
            }
        } catch (e) {
            banner.innerText = "Ready to vote";
        }

        // Load contestants for this show
        try {
            const res = await fetch(`${API_ROOT}/contestants`);
            if (res.ok) {
                const allContestants = await res.json();
                contestantsList = allContestants.filter(c => String(c.showId) === String(showId));

                select.innerHTML = '<option value="" class="bg-zinc-900 text-white">-- Select a Contestant --</option>';
                contestantsList.forEach(c => {
                    select.innerHTML += `<option value="${c.id}" class="bg-zinc-900 text-white">#${c.id} - ${c.name} (Age ${c.age})</option>`;
                });
            }
        } catch (error) {
            select.innerHTML = '<option value="" class="bg-zinc-900 text-white">Error loading contestants</option>';
        }
        updateContestantImage();
    }

    function updateContestantImage() {
        const select = document.getElementById('candidateId');
        const selectedId = select.value;
        const container = document.getElementById('contestant-img-container');

        if (!selectedId) {
            container.innerHTML = '<i data-lucide="user" class="w-16 h-16 opacity-30"></i>';
            lucide.createIcons();
            return;
        }

        const contestant = contestantsList.find(c => c.id == selectedId);
        if (contestant && contestant.photoUrl) {
            container.innerHTML = `<img src="${contestant.photoUrl}" alt="${contestant.name}" class="w-full h-full object-cover">`;
        } else {
            container.innerHTML = '<i data-lucide="user" class="w-16 h-16 opacity-30"></i>';
            lucide.createIcons();
        }
    }

    async function castVote(event) {
        event.preventDefault();

        if (!Auth.isLoggedIn) {
            alert("You must be logged in to cast a vote!");
            window.location.href = 'user-portal.html';
            return;
        }

        const showId = document.getElementById('show-select').value;
        const contestantId = document.getElementById('candidateId').value;

        if (!showId || !contestantId) {
            alert("Please select both a show and a contestant.");
            return;
        }

        const payload = {
            userId: parseInt(Auth.userId),
            showId: parseInt(showId),
            contestantId: parseInt(contestantId)
        };

        try {
            const response = await fetch(`${API_ROOT}/votes`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok) {
                alert("Success: Vote recorded successfully!");
                onShowSelected(showId); // Refresh state
            } else {
                alert(result.message || "You have already cast a vote in this show.");
            }
        } catch (error) {
            alert("Server connection failed while submitting vote.");
        }
    }

    window.onload = () => {
        if (sessionStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'user-portal.html';
            return;
        }

        const savedTheme = localStorage.getItem('preferred-theme') || 'theme-light';
        setTheme(savedTheme);
        loadShows();
    };

    const Auth = {
        get(key) {
            const v = sessionStorage.getItem(key) ?? localStorage.getItem(key);
            return (v === 'undefined' || v === 'null') ? null : v;
        },
        clear() {
            ['isLoggedIn', 'userId', 'userName', 'userEmail', 'userRole', 'userProfile', 'isAdminAuthenticated']
                .forEach(k => { sessionStorage.removeItem(k); localStorage.removeItem(k); });
        },
        get isLoggedIn() { return this.get('isLoggedIn') === 'true' && !!this.get('userId'); },
        get userId()     { return this.get('userId'); },
        get userName()   { return this.get('userName') || 'User'; },
        get userEmail()  { return this.get('userEmail') || ''; },
        get role()       { return (this.get('userRole') || '').toUpperCase().replace('ROLE_', ''); },

        logout(redirect = 'user-portal.html') {
            this.clear();
            localStorage.clear();
            sessionStorage.clear();
            window.location.replace(redirect);
        }
    };
</script>
</body>
</html>
