<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Center - Voting System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { overflow-x: hidden; transition: background-color 0.4s ease, color 0.4s ease; }
        ::selection { background: currentColor; color: background; }

        .support-input { width: 100%; background: transparent; border-bottom: 1px solid; border-color: inherit; padding: 0.75rem 0; font-size: 0.875rem; transition: all 0.3s ease; outline: none; border-radius: 0; opacity: 0.8; }
        .support-input:focus { opacity: 1; border-color: currentColor; }

        .support-select { width: 100%; background: transparent; border-bottom: 1px solid; border-color: inherit; padding: 0.75rem 0; font-size: 0.875rem; outline: none; opacity: 0.8; cursor: pointer; appearance: none; }

        body.theme-light { background-color: #f2f2f2; color: #000000; }
        body.theme-light .support-card { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-color: #e4e4e7; }
        body.theme-light .support-select option { background: #fff; color: #000; }
        body.theme-light .modal-bg { background-color: rgba(255, 255, 255, 0.95); }

        body.theme-dark { background-color: #050609; color: #f2f2f2; }
        body.theme-dark .support-card { background-color: rgba(18, 19, 22, 0.9); backdrop-filter: blur(12px); border-color: #27272a; }
        body.theme-dark .support-select option { background: #121316; color: #fff; }
        body.theme-dark .modal-bg { background-color: rgba(5, 6, 9, 0.95); }

        body.theme-white { background-color: #ffffff; color: #09090b; }
        body.theme-white .support-card { background-color: rgba(249, 249, 251, 0.9); backdrop-filter: blur(12px); border-color: #f4f4f5; }
        body.theme-white .support-select option { background: #fff; color: #000; }
        body.theme-white .modal-bg { background-color: rgba(255, 255, 255, 0.98); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col theme-light relative" id="site-body">

<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-10">
    <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=1600&q=80" alt="Background" class="w-full h-full object-cover grayscale mix-blend-multiply">
</div>

<!-- HEADER -->
<div class="sticky top-0 backdrop-blur-md z-40 border-b border-current/10 px-8 py-6 flex justify-between items-center transition-colors duration-300">
    <div class="flex items-center gap-4 relative z-10">
        <i data-lucide="life-buoy" class="w-5 h-5"></i>
        <h2 class="font-bold text-sm tracking-widest uppercase">Support Center</h2>
    </div>
    <div class="flex items-center border rounded-full p-1 text-xs font-bold uppercase tracking-wider border-current/25 relative z-10">
        <button onclick="setTheme('theme-light')" id="btn-light" class="px-3 py-1 rounded-full transition-all">Light</button>
        <button onclick="setTheme('theme-dark')" id="btn-dark" class="px-3 py-1 rounded-full transition-all">Dark</button>
    </div>
    <div class="flex items-center gap-6 relative z-10">
        <button onclick="goBack()" class="flex items-center gap-2 text-sm font-bold uppercase tracking-widest opacity-80 hover:opacity-100 transition-opacity">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Return
        </button>
    </div>
</div>

<div class="max-w-7xl mx-auto w-full px-8 py-12 flex-1 relative z-10">

    <!-- ALERT BOX -->
    <div id="alert-box" class="hidden text-sm font-mono uppercase tracking-wider mb-8 p-4 border rounded"></div>

    <!-- ==================== USER VIEW ==================== -->
    <div id="user-view" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        <!-- Submit Ticket Form -->
        <div class="lg:col-span-4">
            <div class="support-card p-8 border shadow-sm transition-colors duration-300">
                <h3 class="text-xs font-bold uppercase tracking-widest mb-6"><i data-lucide="send" class="w-4 h-4 inline mr-1"></i> Submit a Request</h3>
                <form id="ticket-form" onsubmit="submitTicket(event)" class="flex flex-col gap-6">
                    <div>
                        <label class="block text-[10px] font-mono uppercase opacity-60 mb-1">Issue Category</label>
                        <select id="ticket-type" class="support-select" required>
                            <option value="INQUIRY">General Inquiry</option>
                            <option value="FEEDBACK">Feedback & Suggestions</option>
                            <option value="COMPLAINT">Complaint</option>
                            <option value="ABUSE_REPORT">Report Abuse</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-mono uppercase opacity-60 mb-1">Subject</label>
                        <input type="text" id="ticket-title" class="support-input" placeholder="Brief summary of issue" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-mono uppercase opacity-60 mb-1">Details</label>
                        <textarea id="ticket-desc" class="support-input resize-none h-32" placeholder="Please provide as much detail as possible..." required></textarea>
                    </div>
                    <button type="submit" class="w-full bg-current text-background text-xs font-bold uppercase tracking-widest py-3 hover:opacity-90 transition-opacity" style="background-color: var(--tw-prose-invert-body, black); color: white;">Submit Ticket</button>
                </form>
            </div>
        </div>

        <!-- My Tickets List -->
        <div class="lg:col-span-8">
            <h3 class="text-xs font-bold uppercase tracking-widest mb-4 opacity-80">My Ticket History</h3>
            <div class="overflow-x-auto support-card p-6 border shadow-sm">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead>
                    <tr class="border-b-2 border-current/30 text-[10px] font-bold uppercase tracking-widest opacity-70">
                        <th class="py-4 pr-6">Reference</th><th class="py-4 pr-6">Subject</th><th class="py-4 pr-6">Type</th><th class="py-4 pr-6">Status</th><th class="py-4 text-right">Action</th>
                    </tr>
                    </thead>
                    <tbody id="user-tickets-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ==================== ADMIN VIEW ==================== -->
    <div id="admin-view" class="hidden flex-col gap-8">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="support-card p-6 border shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-[10px] font-bold uppercase tracking-widest opacity-60">Open Tickets</p>
                    <p class="text-3xl font-light mt-1" id="stat-open">0</p>
                </div>
                <i data-lucide="inbox" class="w-8 h-8 opacity-20"></i>
            </div>
            <div class="support-card p-6 border shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-[10px] font-bold uppercase tracking-widest opacity-60">Active Complaints</p>
                    <p class="text-3xl font-light mt-1 text-red-500" id="stat-complaints">0</p>
                </div>
                <i data-lucide="alert-triangle" class="w-8 h-8 opacity-20 text-red-500"></i>
            </div>
        </div>

        <!-- Master Ticket List -->
        <div>
            <h3 class="text-xs font-bold uppercase tracking-widest mb-4 opacity-80">Global Ticket Registry</h3>
            <div class="overflow-x-auto support-card p-6 border shadow-sm">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead>
                    <tr class="border-b-2 border-current/30 text-[10px] font-bold uppercase tracking-widest opacity-70">
                        <th class="py-4 pr-6">Reference</th><th class="py-4 pr-6">User ID</th><th class="py-4 pr-6">Subject</th><th class="py-4 pr-6">Type</th><th class="py-4 pr-6">Status</th><th class="py-4 text-right">Action</th>
                    </tr>
                    </thead>
                    <tbody id="admin-tickets-body"></tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<!-- TICKET DETAILS MODAL (Used for both viewing and replying) -->
<div id="ticket-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeModal()"></div>
    <div class="modal-bg w-full max-w-2xl border shadow-2xl relative flex flex-col max-h-[90vh]">

        <div class="p-6 border-b border-current/10 flex justify-between items-center">
            <div>
                <h3 class="font-bold uppercase tracking-widest text-sm" id="modal-title">Ticket Details</h3>
                <p class="text-xs font-mono opacity-60 mt-1" id="modal-ref"></p>
            </div>
            <button onclick="closeModal()" class="opacity-50 hover:opacity-100 transition-opacity"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <div class="p-6 overflow-y-auto flex-1 text-sm border-b border-current/10">
            <div class="mb-6">
                <h4 class="text-[10px] font-bold uppercase tracking-widest opacity-50 mb-2">Original Description</h4>
                <div class="p-4 bg-current/5 border border-current/10 rounded font-mono text-xs whitespace-pre-wrap" id="modal-desc"></div>
            </div>

            <!-- Admin Only: Status Update -->
            <div id="admin-status-controls" class="hidden mb-6 p-4 border border-current/10 rounded bg-current/5 flex items-center gap-4">
                <span class="text-[10px] font-bold uppercase tracking-widest opacity-70">Update Status:</span>
                <select id="update-status-select" class="support-select !border-none !py-1 flex-1 text-xs font-bold">
                    <option value="OPEN">OPEN</option>
                    <option value="IN_PROGRESS">IN_PROGRESS</option>
                    <option value="RESOLVED">RESOLVED</option>
                    <option value="CLOSED">CLOSED</option>
                </select>
                <button onclick="updateStatus()" class="text-[10px] font-bold uppercase tracking-widest px-3 py-1 border border-current rounded hover:bg-current hover:text-background transition-colors">Apply</button>
            </div>
        </div>

        <!-- Reply Section (Simplified for this UI) -->
        <div class="p-6 bg-current/5">
            <h4 class="text-[10px] font-bold uppercase tracking-widest opacity-50 mb-3">Add Note / Reply</h4>
            <textarea id="reply-message" class="support-input bg-transparent border border-current/20 p-3 text-xs h-20 mb-3" placeholder="Type your response..."></textarea>
            <div class="flex justify-end items-center gap-4">
                <label class="hidden items-center gap-2 text-xs font-mono cursor-pointer" id="internal-note-toggle">
                    <input type="checkbox" id="reply-internal"> <span class="opacity-70">Internal Note</span>
                </label>
                <button onclick="sendReply()" class="bg-current text-background text-[10px] font-bold uppercase tracking-widest px-6 py-2 hover:opacity-90 transition-opacity" style="background-color: var(--tw-prose-invert-body, black); color: white;">Send Reply</button>
            </div>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();
    const API_BASE = 'http://localhost:8080/api/support/tickets';

    // Auth State
    const isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';
    const userRole = sessionStorage.getItem('userRole') || 'VOTER';
    // IMPORTANT: Make sure your login endpoint saves 'userId' to sessionStorage!
    // For testing purposes, if it's missing, we default to 1.
    const currentUserId = sessionStorage.getItem('userId') || 1;

    let activeModalTicketId = null;

    function setTheme(themeName) {
        const body = document.getElementById('site-body');
        body.className = `antialiased min-h-screen flex flex-col relative ${themeName}`;
        localStorage.setItem('preferred-theme', themeName);
        ['theme-light', 'theme-dark', 'theme-white'].forEach(t => {
            const btn = document.getElementById(t.replace('theme-', 'btn-'));
            if(btn) { btn.style.backgroundColor = t === themeName ? 'currentColor' : 'transparent'; btn.style.color = t === themeName ? (themeName === 'theme-dark' ? '#000' : '#fff') : 'inherit'; }
        });
    }

    function goBack() {
        window.location.href = 'index.html';
    }

    function showAlert(msg, isSuccess) {
        const box = document.getElementById('alert-box');
        box.textContent = msg;
        box.className = `text-sm font-mono uppercase tracking-wider mb-8 p-4 border rounded ${isSuccess ? 'bg-green-500/10 text-green-600 border-green-500/20' : 'bg-red-500/10 text-red-500 border-red-500/20'}`;
        box.classList.remove('hidden');
        setTimeout(() => box.classList.add('hidden'), 5000);
    }

    function getStatusColor(status) {
        switch(status) {
            case 'OPEN': return 'text-orange-500';
            case 'IN_PROGRESS': return 'text-blue-500';
            case 'RESOLVED': return 'text-green-500';
            case 'CLOSED': return 'opacity-50';
            default: return '';
        }
    }

    // --- USER FUNCTIONS ---
    async function submitTicket(e) {
        e.preventDefault();
        const payload = {
            title: document.getElementById('ticket-title').value,
            description: document.getElementById('ticket-desc').value,
            type: document.getElementById('ticket-type').value,
            submittedByUserId: currentUserId
        };

        try {
            const res = await fetch(API_BASE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (res.ok) {
                showAlert('Ticket submitted successfully.', true);
                document.getElementById('ticket-form').reset();
                fetchUserTickets();
            } else showAlert('Failed to submit ticket.', false);
        } catch(err) { showAlert('Connection error.', false); }
    }

    async function fetchUserTickets() {
        try {
            const res = await fetch(`${API_BASE}/user/${currentUserId}`);
            const tickets = await res.json();
            const tbody = document.getElementById('user-tickets-body');
            tbody.innerHTML = tickets.length ? tickets.map(t => `
                <tr class="border-b border-current/10 hover:bg-current/5 transition-colors cursor-pointer" onclick="openTicketModal(${t.id})">
                    <td class="py-4 pr-6 font-mono text-xs">${t.ticketRef}</td>
                    <td class="py-4 pr-6 font-medium">${t.title}</td>
                    <td class="py-4 pr-6 text-xs">${t.type}</td>
                    <td class="py-4 pr-6 font-bold text-xs ${getStatusColor(t.status)}">${t.status}</td>
                    <td class="py-4 text-right text-xs opacity-50">View &rarr;</td>
                </tr>
            `).join('') : `<tr><td colspan="5" class="py-8 text-center opacity-50 italic text-xs">No tickets found.</td></tr>`;
        } catch(err) {}
    }

    // --- ADMIN FUNCTIONS ---
    async function fetchAdminData() {
        try {
            // Stats
            const statRes = await fetch(`${API_BASE}/stats`);
            const stats = await statRes.json();
            document.getElementById('stat-open').innerText = stats.openTickets || 0;
            document.getElementById('stat-complaints').innerText = stats.activeComplaints || 0;

            // All Tickets
            const res = await fetch(API_BASE);
            const tickets = await res.json();
            const tbody = document.getElementById('admin-tickets-body');
            tbody.innerHTML = tickets.length ? tickets.map(t => `
                <tr class="border-b border-current/10 hover:bg-current/5 transition-colors cursor-pointer" onclick="openTicketModal(${t.id})">
                    <td class="py-4 pr-6 font-mono text-xs">${t.ticketRef}</td>
                    <td class="py-4 pr-6 font-mono text-xs">USR-${t.submittedByUserId}</td>
                    <td class="py-4 pr-6 font-medium truncate max-w-[200px]">${t.title}</td>
                    <td class="py-4 pr-6 text-xs">${t.type}</td>
                    <td class="py-4 pr-6 font-bold text-xs ${getStatusColor(t.status)}">${t.status}</td>
                    <td class="py-4 text-right text-xs opacity-50">Manage &rarr;</td>
                </tr>
            `).join('') : `<tr><td colspan="6" class="py-8 text-center opacity-50 italic text-xs">No tickets in system.</td></tr>`;
        } catch(err) {}
    }

    async function updateStatus() {
        const newStatus = document.getElementById('update-status-select').value;
        try {
            const res = await fetch(`${API_BASE}/${activeModalTicketId}`, {
                method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: newStatus })
            });
            if(res.ok) {
                showAlert('Status updated successfully.', true);
                closeModal();
                fetchAdminData();
            }
        } catch(err) {}
    }

    // --- SHARED FUNCTIONS ---
    async function openTicketModal(id) {
        activeModalTicketId = id;
        try {
            const res = await fetch(`${API_BASE}/${id}`);
            const ticket = await res.json();

            document.getElementById('modal-title').innerText = ticket.title;
            document.getElementById('modal-ref').innerText = `${ticket.ticketRef}  •  ${ticket.type}  •  ${ticket.status}`;
            document.getElementById('modal-desc').innerText = ticket.description;

            if(userRole === 'ADMIN') {
                document.getElementById('admin-status-controls').classList.remove('hidden');
                document.getElementById('internal-note-toggle').classList.remove('hidden');
                document.getElementById('update-status-select').value = ticket.status;
            }

            document.getElementById('ticket-modal').classList.remove('hidden');
        } catch(err) { showAlert('Error loading ticket details.', false); }
    }

    function closeModal() {
        document.getElementById('ticket-modal').classList.add('hidden');
        document.getElementById('reply-message').value = '';
        activeModalTicketId = null;
    }

    async function sendReply() {
        const msg = document.getElementById('reply-message').value;
        if(!msg) return;

        const payload = {
            responderUserId: currentUserId,
            message: msg,
            isInternalNote: document.getElementById('reply-internal')?.checked || false
        };

        try {
            const res = await fetch(`${API_BASE}/${activeModalTicketId}/replies`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
            });
            if(res.ok) {
                showAlert('Reply sent successfully.', true);
                closeModal();
            } else showAlert('Failed to send reply.', false);
        } catch(err) { showAlert('Connection error.', false); }
    }

    // --- INITIALIZATION ---
    window.onload = () => {
        if (!isLoggedIn) {
            window.location.href = 'user-portal.html';
            return;
        }

        setTheme(localStorage.getItem('preferred-theme') || 'theme-light');

        if (userRole === 'ADMIN') {
            document.getElementById('admin-view').classList.remove('hidden');
            document.getElementById('admin-view').classList.add('flex');
            fetchAdminData();
        } else {
            document.getElementById('user-view').classList.remove('hidden');
            fetchUserTickets();
        }
    };

    const Auth = {
        get(key) {
            const v = sessionStorage.getItem(key) ?? localStorage.getItem(key);
            return (v === 'undefined' || v === 'null') ? null : v;
        },
        save(user, role) {
            const { passwordHash, password, ...safeUser } = user;
            const entries = {
                isLoggedIn: 'true',
                userId: String(user.id),
                userName: user.name || user.email || 'User',
                userEmail: user.email || '',
                userRole: role,
                userProfile: JSON.stringify(safeUser)
            };
            Object.entries(entries).forEach(([k, v]) => {
                sessionStorage.setItem(k, v);
                localStorage.setItem(k, v);
            });
        },
        clear() {
            ['isLoggedIn', 'userId', 'userName', 'userEmail', 'userRole', 'userProfile', 'isAdminAuthenticated']
                .forEach(k => { sessionStorage.removeItem(k); localStorage.removeItem(k); });
        },
        get isLoggedIn() { return this.get('isLoggedIn') === 'true' && !!this.get('userId'); },
        get userId()     { return this.get('userId'); },
        get userName()   { return this.get('userName') || 'User'; },
        get userEmail()  { return this.get('userEmail') || ''; },
        get role()       { return (this.get('userRole') || '').toUpperCase().replace('ROLE_', ''); },
        get profile()    { try { return JSON.parse(this.get('userProfile')); } catch { return null; } },

        // --> REPLACE YOUR LOGOUT METHOD WITH THIS ENTIRE BLOCK:
        logout(redirect = 'user-portal.html') {
            this.clear();
            localStorage.clear();
            sessionStorage.clear();
            window.location.replace(redirect);
        }
    };
</script>
</body>
</html>
